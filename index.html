<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FleetDesk – Rental Car CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6eb;--ac:#0f766e;--wa:#b45309;--er:#b42318;--ok:#067647}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b94a3;--bd:#272d37;--ac:#2dd4bf;--wa:#fbbf24;--er:#f87171;--ok:#4ade80}}
:root[data-theme=dark]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b94a3;--bd:#272d37;--ac:#2dd4bf;--wa:#fbbf24;--er:#f87171;--ok:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:18px;margin:0}nav{display:flex;gap:6px}nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--ac);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}h2{font-size:16px;margin:0}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:14px;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.s{padding:5px 9px;font-size:13px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}.available,.closed{color:var(--ok)}.rented,.open{color:var(--ac)}.service,.due{color:var(--wa)}.over{color:var(--er)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}.modal.on{display:flex}.box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:560px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}form label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:3px}form .f{grid-column:1/-1}
input,select,textarea{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}.err{color:var(--er);font-size:13px;grid-column:1/-1;min-height:16px}
.slip h3{margin:0 0 4px}.slip table{min-width:0}.slip td:first-child{color:var(--mu);width:40%}.sig{display:flex;justify-content:space-between;margin-top:36px;font-size:13px}.sig div{border-top:1px solid var(--tx);padding-top:4px;width:44%}
.slip .wrap td:first-child{color:inherit;width:auto}.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;line-height:2.4;font-size:14px;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-top:14px;text-align:right}
@media(max-width:560px){form{grid-template-columns:1fr}nav button{padding:8px}}
@media print{body *{visibility:hidden}#slipbox,#slipbox *{visibility:visible}#slipbox{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff}.noprint{display:none}}
</style></head><body>
<header><h1>🚗 FleetDesk <small id=sy style="font-weight:400;color:var(--mu);font-size:12px"></small></h1><nav><button data-t="dash" class="on">Dashboard</button><button data-t="cars">Vehicles</button><button data-t="book">Bookings</button><button data-t="rep">Reports</button></nav></header>
<main id="m"></main><div class="modal" id="md"><div class="box" id="bx"></div></div>
<script>
// Paste your Google Apps Script Web App URL here (from Code.gs deployment). Empty = browser-only demo with sample data.
const SHEET_URL="https://script.google.com/macros/s/AKfycbwsimJ2eFUmL7Az-ygxNdMxra84bSji8kji91KsTAbxbi4JmYKDcneyOXWJAcHrV6NVOg/exec";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date().toISOString().slice(0,10),addD=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const days=(a,b)=>Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)),rs=n=>"Rs "+Number(n||0).toLocaleString("en-PK");
let S={v:[],b:[]},tab="dash";
try{S=JSON.parse(localStorage.getItem("fd2")||"")||S}catch(e){}
if(!S.v.length&&!SHEET_URL){S={v:[
{id:1,name:"Toyota Corolla GLi",plate:"LEA-21-4567",year:2021,rate:9000,meter:48200,lastOil:44000,every:5000,status:"available"},
{id:2,name:"Honda City",plate:"LEB-22-1188",year:2022,rate:8500,meter:31050,lastOil:26500,every:5000,status:"rented"},
{id:3,name:"Suzuki Alto VXL",plate:"ABC-20-909",year:2020,rate:5000,meter:67400,lastOil:62000,every:5000,status:"available"},
{id:4,name:"Toyota Hilux Revo",plate:"LEC-23-7700",year:2023,rate:20000,meter:22100,lastOil:20000,every:7500,status:"service"}],
b:[{id:1,cust:"Ali Raza",cnic:"35202-1234567-1",phone:"0300-1234567",vid:2,from:addD(-2),to:addD(1),rate:8500,adv:10000,outM:30800,outF:"3/4",outN:"Small scratch on rear bumper",status:"open"}]};seedHist()}S.m=S.m||[];
function save(){try{localStorage.setItem("fd2",JSON.stringify(S))}catch(e){}
 push()}
const car=id=>S.v.find(v=>v.id==id)||{};
const oil=v=>{const u=v.meter-v.lastOil;return u>=5000?["over","Overdue"]:u>=5000-500?["due","Due soon"]:["available","OK"]}
function go(t){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));render()}
document.querySelector("nav").onclick=e=>e.target.dataset.t&&go(e.target.dataset.t);
function render(){$("#m").innerHTML=banner()+({dash,cars,book,rep})[tab]()}
function dash(){const av=S.v.filter(v=>v.status=="available").length,rn=S.v.filter(v=>v.status=="rented").length,od=S.v.filter(v=>oil(v)[0]!="available").length;
 const open=S.b.filter(b=>b.status=="open"),rev=S.b.filter(b=>b.status=="closed").reduce((a,b)=>a+b.total,0);
 return`<div class=grid><div class="card stat"><b>${S.v.length}</b><span>Total vehicles</span></div><div class="card stat"><b>${av}</b><span>Available</span></div><div class="card stat"><b>${rn}</b><span>On rent</span></div><div class="card stat"><b style="color:var(--wa)">${od}</b><span>Oil change alerts</span></div><div class="card stat"><b>${rs(rev)}</b><span>Collected revenue</span></div></div>
<div class=card><h2>Expected returns</h2><div class=wrap><table><tr><th>Booking<th>Customer<th>Vehicle<th>Due back</tr>${open.map(b=>`<tr><td>#${b.id}<td>${esc(b.cust)}<td>${esc(car(b.vid).name)}<td>${b.to}${b.to<today?' <span class="tag over">Late</span>':""}</tr>`).join("")||"<tr><td colspan=4>No active rentals</tr>"}</table></div></div>
<div class=card><h2>Service alerts</h2><div class=wrap><table><tr><th>Vehicle<th>Meter<th>Since oil change<th>Status</tr>${S.v.filter(v=>oil(v)[0]!="available").map(v=>`<tr><td>${esc(v.name)}<td>${v.meter} km<td>${v.meter-v.lastOil} / ${5000} km<td><span class="tag ${oil(v)[0]}">${oil(v)[1]}</span></tr>`).join("")||"<tr><td colspan=4>All vehicles are fine</tr>"}</table></div></div>`}
function cars(){return`<div class=row><h2>Vehicles</h2><button class="btn p" onclick="carForm()">+ Add vehicle</button></div><div class=card><div class=wrap><table><tr><th>Vehicle<th>Plate<th>Rate/day<th>Meter<th>Oil<th>Status<th></tr>${S.v.map(v=>`<tr><td><b>${esc(v.name)}</b> <small>${v.year}</small><td>${esc(v.plate)}<td>${rs(v.rate)}<td>${v.meter} km<td><span class="tag ${oil(v)[0]}">${oil(v)[1]}</span><br><small>last @ ${v.lastOil} km · ${Math.max(0,5000-(v.meter-v.lastOil))} km left</small><td><span class="tag ${v.status}">${v.status}</span><td><button class="btn s" onclick="meterForm(${v.id})">Meter</button> <button class="btn s" onclick="mntForm(${v.id})">Maintenance</button></tr>`).join("")}</table></div></div>`}
function book(){return`<div class=row><h2>Bookings</h2><button class="btn p" onclick="bookForm()">+ New booking</button></div><div class=card><div class=wrap><table><tr><th>#<th>Customer<th>CNIC<th>Vehicle<th>Period<th>Status<th></tr>${[...S.b].reverse().map(b=>`<tr><td>${b.id}<td>${esc(b.cust)}<br><small>${esc(b.phone)}</small><td>${esc(b.cnic)}<td>${esc(car(b.vid).name)}<td>${b.from} → ${b.to}<td><span class="tag ${b.status}">${b.status}</span><td><button class="btn s" onclick="slip(${b.id},'out')">Out slip</button> ${b.status=="open"?`<button class="btn s p" onclick="retForm(${b.id})">Return</button>`:`<button class="btn s" onclick="slip(${b.id},'in')">In slip</button>`}</tr>`).join("")||"<tr><td colspan=7>No bookings yet</tr>"}</table></div></div>`}
const open=h=>{$("#bx").innerHTML=h;$("#md").classList.add("on")},shut=()=>$("#md").classList.remove("on");
function carForm(){open(`<h2>Add vehicle</h2><br><form onsubmit="return addCar(event)"><label class=f>Name / model<input name=name required></label><label>Plate<input name=plate required></label><label>Year<input name=year type=number value=2022></label><label>Rate per day (Rs)<input name=rate type=number required></label><label>Current meter (km)<input name=meter type=number required></label><label>Last oil change (km)<input name=oil type=number required></label><div class="f row"><button type=button class=btn onclick=shut()>Cancel</button><button class="btn p">Save vehicle</button></div></form>`)}
function addCar(e){e.preventDefault();const f=e.target;S.v.push({id:Date.now(),name:f.name.value,plate:f.plate.value.toUpperCase(),year:+f.year.value,rate:+f.rate.value,meter:+f.meter.value,lastOil:+f.oil.value,every:5000,status:"available"});save();shut();render();return false}
function meterForm(id){const v=car(id);open(`<h2>${esc(v.name)}</h2><br><form onsubmit="return upd(event,${id})"><label>Meter reading (km)<input name=m type=number value=${v.meter} min=${v.meter} required></label><label>Status<select name=s>${["available","rented","service"].map(s=>`<option ${s==v.status?"selected":""}>${s}</option>`).join("")}</select></label><div class="f row"><button type=button class=btn onclick=shut()>Cancel</button><button class="btn p">Update</button></div></form>`)}
function upd(e,id){e.preventDefault();const f=e.target,v=car(id);v.meter=+f.m.value;v.status=f.s.value;save();shut();render();return false}
const fmtC=s=>{s=s.replace(/\D/g,"").slice(0,13);return s.length>12?s.slice(0,5)+"-"+s.slice(5,12)+"-"+s[12]:s.length>5?s.slice(0,5)+"-"+s.slice(5):s}
const fmtP=s=>{s=s.replace(/\D/g,"").slice(0,11);return s.length>4?s.slice(0,4)+"-"+s.slice(4):s}
function bookForm(){const av=S.v.filter(v=>v.status=="available");if(!av.length)return alert("No vehicles available");
 open(`<h2>New booking</h2><br><form onsubmit="return addBook(event)"><label class=f>Customer name<input name=cust required></label><label>CNIC (13 digits)<input name=cnic inputmode=numeric placeholder="35202-1234567-1" oninput="this.value=fmtC(this.value)" required></label><label>Mobile (11 digits)<input name=phone inputmode=numeric placeholder="0300-1234567" oninput="this.value=fmtP(this.value)" required></label><label class=f>Vehicle<select name=vid>${av.map(v=>`<option value=${v.id}>${esc(v.name)} – ${esc(v.plate)} (${rs(v.rate)}/day)</option>`).join("")}</select></label><label>Pickup date<input name=from type=date value=${today} required></label><label>Return date<input name=to type=date value=${addD(1)} required></label><label>Advance paid (Rs)<input name=adv type=number value=0></label><label>Fuel level out<select name=fuel><option>Full<option>3/4<option>1/2<option>1/4<option>Empty</select></label><label class=f>Condition notes (dents, scratches…)<textarea name=n rows=2></textarea></label><div class=err id=er></div><div class="f row"><button type=button class=btn onclick=shut()>Cancel</button><button class="btn p">Create booking</button></div></form>`)}
function addBook(e){e.preventDefault();const f=e.target,d=s=>s.replace(/\D/g,"");
 if(d(f.cnic.value).length!=13)return $("#er").textContent="CNIC must be exactly 13 digits (XXXXX-XXXXXXX-X).",false;
 if(!/^03\d{9}$/.test(d(f.phone.value)))return $("#er").textContent="Mobile must be 11 digits starting with 03.",false;
 if(f.to.value<f.from.value)return $("#er").textContent="Return date is before pickup.",false;
 const v=car(f.vid.value),b={id:S.b.length+1,cust:f.cust.value,cnic:f.cnic.value,phone:f.phone.value,vid:v.id,from:f.from.value,to:f.to.value,rate:v.rate,adv:+f.adv.value||0,outM:v.meter,outF:f.fuel.value,outN:f.n.value,status:"open"};
 S.b.push(b);v.status="rented";save();render();slip(b.id,"out");return false}
function retForm(id){const b=S.b.find(x=>x.id==id);open(`<h2>Receive vehicle – #${id}</h2><br><form onsubmit="return ret(event,${id})"><label>Return meter (km)<input name=m type=number min=${b.outM} value=${b.outM} required oninput="oilHint(${b.vid},this.value)"></label><label>Fuel level in<select name=fuel><option>Full<option>3/4<option>1/2<option>1/4<option>Empty</select></label><label>Extra charges (fuel, damage, late) Rs<input name=x type=number value=0></label><label class=f>Condition on return<textarea name=n rows=2></textarea></label><div class=f id=oh></div><div class="f row"><button type=button class=btn onclick=shut()>Cancel</button><button class="btn p">Complete return</button></div></form>`)}
function ret(e,id){e.preventDefault();const f=e.target,b=S.b.find(x=>x.id==id),v=car(b.vid);Object.assign(b,{inM:+f.m.value,inF:f.fuel.value,inN:f.n.value,extra:+f.x.value||0,inDate:today,status:"closed"});
 b.total=days(b.from,b.inDate>b.to?b.inDate:b.to)*b.rate+b.extra;v.meter=b.inM;v.status="available";seal(b);save();render();slip(id,"in");return false}
function slip(id,t){const b=S.b.find(x=>x.id==id),v=car(b.vid),o=t=="out",n=days(b.from,b.to),tot=n*b.rate+(b.extra||0);
 const r=(a,c)=>`<tr><td>${a}<td><b>${esc(c)}</b></tr>`;
 open(`<div id=slipbox class=slip><h3>FleetDesk Rent-a-Car</h3><div style="color:var(--mu)">Vehicle ${o?"Handover (Outgoing)":"Return (Incoming)"} Slip · Booking #${b.id}</div><br><table>${r("Customer",b.cust)}${r("CNIC",b.cnic)}${r("Mobile",b.phone)}${r("Vehicle",v.name+" · "+v.plate)}${r("Rental period",b.from+" to "+b.to+" ("+n+" day"+(n>1?"s":"")+")")}${r("Meter out",b.outM+" km")}${r("Fuel out",b.outF)}${r("Condition out",b.outN||"No remarks")}${o?"":r("Meter in",b.inM+" km ("+(b.inM-b.outM)+" km driven)")+r("Fuel in",b.inF)+r("Condition in",b.inN||"No remarks")+r("Extra charges",rs(b.extra))}${r("Rate",rs(b.rate)+" / day")}${r(o?"Estimated total":"Total",rs(tot))}${r("Advance paid",rs(b.adv))}${r(o?"Balance due":"Balance to collect",rs(tot-b.adv))}</table>${o?`<div dir=rtl lang=ur class=ur>اہم نوٹس: گاڑی وصول کرتے وقت گاہک پر لازم ہے کہ گاڑی کو ہر طرف سے (آگے، پیچھے، دائیں، بائیں، چھت، اندرونی حصہ اور ٹائر) اچھی طرح چیک کرے اور اس کی مکمل ویڈیو بنائے۔ یہ ویڈیو گاڑی واپس کرتے وقت آپ کا ثبوت ہوگی۔ خدانخواستہ اگر واپسی پر گاڑی میں کوئی نقصان، ڈینٹ یا خرابی پائی گئی اور گاہک کے پاس ویڈیو ثبوت موجود نہ ہوا تو تمام نقصان کا ذمہ دار گاہک خود ہوگا اور اس کے خلاف پولیس میں قانونی شکایت درج کروائی جا سکتی ہے۔</div>`:""}<div class=sig><div>Customer signature</div><div>Authorized signature</div></div></div>${t=="in"&&oil(v)[0]!="available"?`<div class="card noprint" style="border-color:var(--wa);margin-top:12px">⚠ <b>Oil change ${v.meter-v.lastOil>=5000?"overdue":"due soon"}</b> – ${Math.max(0,5000-(v.meter-v.lastOil))} km left</div>`:""}<div class="row noprint" style="margin:16px 0 0"><button class=btn onclick=shut()>Close</button><button class="btn p" onclick="window.print()">Print / Save as PDF</button></div>`)}
function banner(){return S.v.filter(v=>oil(v)[0]!="available").map(v=>{const u=v.meter-v.lastOil;return`<div class=card style="border-color:var(--${u>=5000?"er":"wa"});display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><span>⚠ <b>${esc(v.name)}</b> (${esc(v.plate)}): oil change ${u>=5000?"overdue by "+(u-5000):"due in "+(5000-u)} km</span><button class="btn s" onclick="mntForm(${v.id})">Log oil change</button></div>`}).join("")}
function oilHint(id,m){const u=m-car(id).lastOil;$("#oh").innerHTML=u>=5000?`<span class=over>⚠ Oil change overdue by ${u-5000} km</span>`:u>=4500?`<span class=due>⚠ Oil change due in ${5000-u} km</span>`:`<span class=available>Oil OK – ${5000-u} km left</span>`}
function seedHist(){const mk=(id,c,vid,a,z,x)=>{const v=S.v.find(q=>q.id==vid);return{id,cust:c,cnic:"35201-7654321-9",phone:"0321-1112223",vid,from:addD(a),to:addD(z),rate:v.rate,adv:5000,outM:v.meter-900,outF:"Full",outN:"",status:"closed",inM:v.meter-300,inF:"Full",inN:"",extra:x,inDate:addD(z),total:days(addD(a),addD(z))*v.rate+x}};
 S.m=[{id:1,vid:1,type:"Oil change",cost:6500,date:addD(-40),meter:44000,note:""},{id:2,vid:2,type:"Oil change",cost:6000,date:addD(-35),meter:26500,note:""},{id:3,vid:4,type:"Service / repair",cost:18000,date:addD(-10),meter:21000,note:"Brake pads"}];S.b.push(mk(2,"Usman Tariq",1,-30,-25,0),mk(3,"Hina Malik",2,-20,-17,1500),mk(4,"Bilal Ahmed",3,-15,-8,0),mk(5,"Sara Khan",1,-12,-9,2000))}
const H=async t=>{try{const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"n/a"}};
const pay=b=>[b.id,b.vid,b.cust,b.cnic,b.from,b.to,b.rate,b.outM,b.inM,b.inDate,b.extra,b.total].join("|");
const sealed=()=>S.b.filter(x=>x.hash).sort((a,b)=>a.seq-b.seq);
async function seal(b){const q=sealed();b.seq=q.length+1;b.prev=q.length?q[q.length-1].hash:"GENESIS";b.hash=await H(b.prev+pay(b));save()}
async function verify(){let p="GENESIS";for(const b of sealed()){if(b.prev!=p||await H(p+pay(b))!=b.hash)return{ok:false,bad:b.id};p=b.hash}return{ok:true,head:p}}
let RG={a:addD(-90),z:today};
function stats(){const bs=S.b.filter(b=>b.status=="closed"&&b.inDate>=RG.a&&b.inDate<=RG.z),span=days(RG.a,RG.z)+1;
 const rows=S.v.map(v=>{const q=bs.filter(b=>b.vid==v.id),g=q.reduce((a,b)=>a+b.total,0),m=S.m.filter(x=>x.vid==v.id&&x.date>=RG.a&&x.date<=RG.z).reduce((a,x)=>a+x.cost,0),d=q.reduce((a,b)=>a+days(b.from,b.inDate>b.to?b.inDate:b.to),0);return{v,n:q.length,d,km:q.reduce((a,b)=>a+b.inM-b.outM,0),g,c:g*.2,m,o:g*.8-m,u:Math.min(100,Math.round(d/span*100))}});
 return{rows,t:rows.reduce((a,r)=>({n:a.n+r.n,d:a.d+r.d,km:a.km+r.km,g:a.g+r.g,c:a.c+r.c,m:a.m+r.m,o:a.o+r.o}),{n:0,d:0,km:0,g:0,c:0,m:0,o:0})}}
const tbl=st=>`<table><tr><th>Vehicle<th>Trips<th>Days<th>Km<th>Gross<th>Manager 20%<th>Maint.<th>Owner net<th>Util.</tr>${st.rows.map(r=>`<tr><td>${esc(r.v.name)}<br><small>${esc(r.v.plate)}</small><td>${r.n}<td>${r.d}<td>${r.km}<td>${rs(r.g)}<td>${rs(r.c)}<td>${rs(r.m)}<td><b>${rs(r.o)}</b><td>${r.u}%</tr>`).join("")}<tr><td><b>Total</b><td>${st.t.n}<td>${st.t.d}<td>${st.t.km}<td><b>${rs(st.t.g)}</b><td>${rs(st.t.c)}<td>${rs(st.t.m)}<td><b>${rs(st.t.o)}</b><td></tr></table>`;
function rep(){const st=stats();verify().then(x=>{const e=$("#vs");if(e)e.innerHTML=x.ok?`<span class="tag available">✔ Ledger verified</span>`:`<span class="tag over">✖ Tampering detected at booking #${x.bad}</span>`});
 return`<div class=row><h2>Revenue reports</h2><button class="btn p" onclick="repDoc()">Download owner report (PDF)</button></div><div class=card><div class=row style="margin:0"><label>From <input style="width:auto" type=date value=${RG.a} onchange="RG.a=this.value;render()"></label><label>To <input style="width:auto" type=date value=${RG.z} onchange="RG.z=this.value;render()"></label><span id=vs></span></div></div><div class=card><div class=wrap>${tbl(st)}${mlog()}</div><small>Figures come only from completed bookings sealed in a hash-chained ledger. Manager commission is 20% of each booking total; owner net = 80% minus maintenance and oil change costs.</small></div>`}
async function repDoc(){const st=stats(),v=await verify(),h=await H(JSON.stringify(st.t)+RG.a+RG.z+(v.head||"")),now=new Date().toLocaleString("en-GB");
 open(`<div id=slipbox class=slip><h3>FleetDesk – Owner Revenue Report</h3><div style="color:var(--mu)">Period ${RG.a} to ${RG.z} · Generated ${now}</div><br><div class=wrap>${tbl(st)}${mlog()}</div><br><table><tr><td>Ledger status<td><b>${v.ok?"VERIFIED – all "+sealed().length+" sealed bookings intact":"TAMPERING DETECTED at booking #"+v.bad}</b></tr><tr><td>Ledger head hash<td style="word-break:break-all;white-space:normal"><small>${v.head||"-"}</small></tr><tr><td>Report fingerprint<td style="word-break:break-all;white-space:normal"><small>${h}</small></tr></table><p style="font-size:12px;color:var(--mu)">All figures are calculated automatically from completed bookings, never typed by hand. Any later change to a sealed booking breaks the ledger hash and is flagged here.</p></div><div class="row noprint" style="margin-top:16px"><button class=btn onclick=shut()>Close</button><button class="btn p" onclick="window.print()">Print / Save as PDF</button></div>`)}

const mlog=()=>{const q=S.m.filter(x=>x.date>=RG.a&&x.date<=RG.z).sort((a,b)=>a.date<b.date?-1:1);return`<br><b>Maintenance &amp; oil change log</b><table><tr><th>Date<th>Vehicle<th>Type<th>Meter<th>Cost</tr>${q.map(x=>`<tr><td>${x.date}<td>${esc(car(x.vid).name)}<td>${esc(x.type)}${x.note?" – "+esc(x.note):""}<td>${x.meter} km<td>${rs(x.cost)}</tr>`).join("")||"<tr><td colspan=5>No maintenance in this period</tr>"}</table>`};
function mntForm(id){const v=car(id);open(`<h2>Maintenance – ${esc(v.name)}</h2><br><form onsubmit="return addM(event,${id})"><label>Type<select name=t><option>Oil change<option>Service / repair<option>Tyres<option>Other</select></label><label>Cost (Rs)<input name=c type=number min=0 required></label><label>Date<input name=d type=date value=${today} required></label><label>Meter (km)<input name=m type=number value=${v.meter} required></label><label class=f>Notes<input name=n></label><div class="f row"><button type=button class=btn onclick=shut()>Cancel</button><button class="btn p">Save</button></div></form>`)}
function addM(e,id){e.preventDefault();const f=e.target,v=car(id),m=+f.m.value;S.m.push({id:Date.now(),vid:id,type:f.t.value,cost:+f.c.value||0,date:f.d.value,meter:m,note:f.n.value});if(m>v.meter)v.meter=m;if(f.t.value=="Oil change")v.lastOil=m;save();shut();render();return false}
let PIN=localStorage.getItem("fdpin")||"";
const badge=t=>{const e=$("#sy");if(e)e.textContent=t};
function pinForm(){open(`<h2>Enter access PIN</h2><br><form onsubmit="return setPin(event)"><label class=f>PIN<input name=p type=password required autofocus></label><div class="f row"><button class="btn p">Unlock</button></div></form>`)}
function setPin(e){e.preventDefault();PIN=e.target.p.value;localStorage.setItem("fdpin",PIN);shut();pull();return false}
async function push(){if(!SHEET_URL)return;badge("Syncing…");try{const r=await(await fetch(SHEET_URL,{method:"POST",body:JSON.stringify({pin:PIN,state:S})})).json();if(r.error=="auth")return pinForm();if(r.error){badge("⚠ "+r.error);return pull()}localStorage.removeItem("fdq");badge("✔ Synced")}catch(e){localStorage.setItem("fdq","1");badge("⚠ Offline – saved on this device")}}
async function pull(){if(!SHEET_URL)return;try{const r=await(await fetch(SHEET_URL+"?pin="+encodeURIComponent(PIN))).json();if(r.error=="auth")return pinForm();if(r.state&&r.state.v){S=r.state;S.m=S.m||[];localStorage.setItem("fd2",JSON.stringify(S))}badge("✔ Synced");render()}catch(e){badge("⚠ Offline – using saved data")}}
render();addEventListener("online",push);if(SHEET_URL){localStorage.getItem("fdq")?push().then(pull):pull()}else(async()=>{for(const b of S.b.filter(x=>x.status=="closed"&&!x.hash))await seal(b);render()})();
</script></body></html>
